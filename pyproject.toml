[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stpd-training-smoke"
version = "0.1.0"
description = "Independent STS2 Player Environment learner smoke"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["stpd*"]
