[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stpd-training-smoke"
version = "0.1.0"
description = "Pre-alpha STPD research system; current package provides H1 integration and learning smoke gates"
readme = "README.md"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["stpd*"]
