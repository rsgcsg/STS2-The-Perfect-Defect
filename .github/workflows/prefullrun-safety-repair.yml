name: prefullrun-safety-repair
on:
  push:
    branches: [data/lifecycle/efficiency-v1]
    paths: [.github/prefullrun-safety.patch, .github/workflows/prefullrun-safety-repair.yml]
permissions:
  contents: read
concurrency:
  group: prefullrun-safety-repair
  cancel-in-progress: false
jobs:
  repair:
    if: github.repository == 'rsgcsg/STS2-The-Perfect-Defect' && github.ref == 'refs/heads/data/lifecycle/efficiency-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          version: '0.12.10'
      - name: Apply only exact locally tested source bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^:stpd/data/training_handoff.py)" = 54402d0a4f9d9d3f8b012243690f2b62668ecaa5
          sed -i 's/^ diff --git/diff --git/' .github/prefullrun-safety.patch
          echo 'ac29a24bbce106bfb1990f3fea805434fafb135509512ad087a85863aab5394e  .github/prefullrun-safety.patch' | sha256sum -c -
          git apply --index .github/prefullrun-safety.patch
          test "$(git hash-object stpd/data/training_handoff.py)" = b55b594d2e10ee51106007cd90e84ba9516c405a
          test "$(git hash-object tests/test_legacy_publication_safety.py)" = 8cae83c99f07ab9fdf78a3efbb555c59f1c49b3b
          git rm -f .github/prefullrun-safety.patch .github/workflows/prefullrun-safety-repair.yml
          git diff --cached --check
      - run: uv sync --locked --all-extras
      - run: uv run --locked python -m pytest -q tests/test_training_handoff.py tests/test_legacy_publication_safety.py tests/test_feature_artifact.py
      - name: Preserve tested repair without rewriting history
        shell: bash
        env:
          STPD_SOURCE_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -c user.name='STPD Engineering Automation' -c user.email='stpd-engineering@users.noreply.github.com' commit -m 'fix(data): preserve immutable legacy artifact publication under races'
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$STPD_SOURCE_TOKEN" | base64 -w0)"
          test "$(git ls-remote origin refs/heads/data/lifecycle/efficiency-v1 | cut -f1)" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/data/lifecycle/efficiency-v1
