name: prefullrun-tools-snapshot
on:
  push:
    branches: [ops/prefullrun/finish-v2]
    paths: [.github/workflows/prefullrun-tools-snapshot.yml]
permissions:
  contents: read
concurrency:
  group: prefullrun-tools-snapshot
  cancel-in-progress: true
jobs:
  tools:
    if: github.repository == 'rsgcsg/STS2-The-Perfect-Defect'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare supplemental tokenizer and exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/offline-tools/wheels"
          python -m pip download --no-deps --dest "$RUNNER_TEMP/offline-tools/wheels" --only-binary=:all: --python-version 3.13 --implementation cp --abi cp313 --abi abi3 --platform manylinux2014_x86_64 --platform manylinux_2_28_x86_64 tokenizers==0.22.2
          git bundle create "$RUNNER_TEMP/offline-tools/source.bundle" --all
          git rev-parse HEAD > "$RUNNER_TEMP/offline-tools/HEAD.txt"
          printf '%s\n' 'Supplementary Python 3.13 tools only. Not locked Python 3.11 CI evidence.' > "$RUNNER_TEMP/offline-tools/NON_CLAIMS.txt"
          (cd "$RUNNER_TEMP/offline-tools" && sha256sum wheels/* source.bundle > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: prefullrun-offline-tools-${{ github.sha }}
          path: ${{ runner.temp }}/offline-tools/
          retention-days: 3
          if-no-files-found: error
