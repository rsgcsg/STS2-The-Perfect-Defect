{
  "name": "ci",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main",
        "develop",
        "release/**",
        "hotfix/**"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "linux-portable": {
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "20",
            "cache": "npm"
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Install locked Python environment",
          "run": "uv sync --locked --all-extras"
        },
        {
          "name": "Install exact Platform consumer packages",
          "run": "npm ci"
        },
        {
          "name": "Complete portable contract",
          "run": "uv run --locked python tools/project.py check --base \"${{ github.event.pull_request.base.sha || github.event.before }}\""
        }
      ]
    },
    "windows-portable": {
      "runs-on": "windows-latest",
      "timeout-minutes": 30,
      "steps": [
        {
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262",
          "with": {
            "fetch-depth": 0,
            "persist-credentials": false,
            "ref": "${{ github.event.pull_request.head.sha || github.sha }}"
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "20",
            "cache": "npm"
          }
        },
        {
          "uses": "astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e",
          "with": {
            "enable-cache": true
          }
        },
        {
          "name": "Install locked Python environment",
          "run": "uv sync --locked --all-extras"
        },
        {
          "name": "Install exact Platform consumer packages",
          "run": "npm ci"
        },
        {
          "name": "Complete portable contract",
          "run": "uv run --locked python tools/project.py check --base \"${{ github.event.pull_request.base.sha || github.event.before }}\""
        }
      ]
    },
    "locked-python": {
      "runs-on": "ubuntu-latest",
      "if": "${{ always() }}",
      "needs": [
        "linux-portable",
        "windows-portable"
      ],
      "steps": [
        {
          "name": "Require both portable lanes",
          "shell": "bash",
          "run": "test \"${{ needs.linux-portable.result }}\" = success\ntest \"${{ needs.windows-portable.result }}\" = success"
        }
      ]
    }
  }
}
