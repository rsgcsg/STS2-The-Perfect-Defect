name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  locked-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python and locked environment
        run: uv sync --locked --all-extras
      - name: Static checks
        run: |
          uv run ruff check .
          uv run mypy stpd
      - name: Unit tests
        run: uv run pytest -q
      - name: Compile check
        run: uv run python -m compileall -q stpd tests
